# Fly.io — `fly launch --copy-config --no-deploy`, then follow DEPLOYMENT.md (volume + secrets) and `fly deploy`.
app = "kurovault-change-me"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  TDC_HOST = "0.0.0.0"
  TDC_PORT = "8640"
  TDC_DATA_DIR = "/data"
  TDC_TRUST_PROXY = "1"
  # Fly's proxy always overwrites this header with the real visitor address.
  TDC_CLIENT_IP_HEADER = "fly-client-ip"
  TDC_COOKIE_SECURE = "1"

# One small persistent volume holds the database, sealed secrets and upload staging.
[[mounts]]
  source = "ravenhold_data"  # existing volume name; renaming would start with an empty disk
  destination = "/data"

[http_service]
  internal_port = 8640
  force_https = true
  # Keep one machine running: the Telegram connection and your sessions live in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/public/status"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
